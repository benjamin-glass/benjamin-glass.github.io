<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benjamin's Apps</title>
<style>
/* Plain, high-contrast index page so it loads instantly on the Kindle's e-ink browser */
:root { --paper: #ffffff; --ink: #000000; --ink-soft: #333333; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #151515; --ink: #ececec; --ink-soft: #c9c9c9; color-scheme: dark; }
}
body {
  margin: 0; background: #ffffff; color: #000000; background: var(--paper); color: var(--ink);
  font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.5;
}
.page { max-width: 40rem; margin: 0 auto; padding: 32px 16px 56px; }
h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 8px; }
.lede { margin: 0 0 28px; color: #333333; color: var(--ink-soft); }
ul { list-style: none; margin: 0; padding: 0; border-top: 3px solid currentColor; }
li { border-bottom: 1px dotted currentColor; }
a { display: block; padding: 16px 0; color: inherit; text-decoration: none; }
a:focus { outline: 3px solid currentColor; outline-offset: 2px; }
.name { display: block; font-size: 1.25rem; font-weight: bold; text-decoration: underline; }
.what { display: block; font-family: "Courier New", Courier, monospace; font-size: 0.875rem; color: #333333; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="page">
  <h1>Benjamin's Apps</h1>
  <p class="lede">Small web apps built for the Kindle Scribe's browser.</p>
  <ul>
    <li><a href="scribe-check/"><span class="name">Scribe Browser Check</span><span class="what">Tests which web features the Kindle browser supports</span></a></li>
  </ul>
</div>
</body>
</html>
